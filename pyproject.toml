[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "simupharm"
version = "1.0.0"
description = "A Unified Open-Source Multi-Instrument Analytical and Spectroscopic Simulation Engine in Python"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "SimuPharm Research Team", email = "research@simupharm.io" }
]
keywords = [
    "analytical chemistry",
    "spectroscopy",
    "chromatography",
    "HPLC",
    "GC",
    "FTIR",
    "UV-Vis",
    "mass spectrometry",
    "simulation",
    "in-silico"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12"
]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "pydantic>=2.0.0"
]

[project.optional-dependencies]
vis = [
    "matplotlib>=3.7.0"
]
test = [
    "pytest>=7.0.0"
]
all = [
    "matplotlib>=3.7.0",
    "pytest>=7.0.0"
]

[project.urls]
Homepage = "https://github.com/simupharm/simupharm"
Documentation = "https://simupharm.readthedocs.io"
Repository = "https://github.com/simupharm/simupharm.git"
"Bug Tracker" = "https://github.com/simupharm/simupharm/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["simupharm*"]
