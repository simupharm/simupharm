<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Platform Metrics — SimuPharma</title>
    <meta name="description" content="SimuPharma platform usage statistics and growth metrics">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg: #0a0e1a; --surface: #111827; --card: #1a2235;
            --border: rgba(99, 102, 241, 0.12); --text: #e2e8f0; --muted: #94a3b8;
            --primary: #6366f1;
        }
        body { font-family: 'Inter', system-ui, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

        .metrics-header {
            text-align: center; padding: 60px 24px 40px;
            background: linear-gradient(180deg, rgba(99,102,241,0.08) 0%, transparent 100%);
        }
        .metrics-header h1 { font-size: 2.2rem; font-weight: 900; margin-bottom: 8px; }
        .metrics-header h1 span { background: linear-gradient(135deg, #6366f1, #a78bfa); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .metrics-header p { color: var(--muted); font-size: 1rem; max-width: 500px; margin: 0 auto; }

        .metrics-grid {
            max-width: 1100px; margin: 0 auto; padding: 0 24px 60px;
            display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 18px;
        }
        .metric-card {
            background: var(--card); border: 1px solid var(--border); border-radius: 16px;
            padding: 28px 24px; text-align: center; transition: transform 0.2s, box-shadow 0.2s;
        }
        .metric-card:hover { transform: translateY(-3px); box-shadow: 0 8px 30px rgba(99,102,241,0.1); }
        .metric-icon { font-size: 1.6rem; margin-bottom: 12px; }
        .metric-value { font-size: 2.4rem; font-weight: 900; margin-bottom: 4px; }
        .metric-label { font-size: 0.78rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }

        .metric-card:nth-child(1) .metric-value { color: #a5b4fc; }
        .metric-card:nth-child(2) .metric-value { color: #6ee7b7; }
        .metric-card:nth-child(3) .metric-value { color: #fcd34d; }
        .metric-card:nth-child(4) .metric-value { color: #f9a8d4; }
        .metric-card:nth-child(5) .metric-value { color: #93c5fd; }
        .metric-card:nth-child(6) .metric-value { color: #c4b5fd; }

        .instrument-section {
            max-width: 1100px; margin: 0 auto; padding: 0 24px 60px;
        }
        .instrument-section h2 { font-size: 1.2rem; font-weight: 700; margin-bottom: 18px; text-align: center; }
        .inst-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 12px; }
        .inst-card {
            background: var(--card); border: 1px solid var(--border); border-radius: 12px;
            padding: 18px; text-align: center;
        }
        .inst-count { font-size: 1.5rem; font-weight: 800; color: #a5b4fc; }
        .inst-name { font-size: 0.7rem; color: var(--muted); margin-top: 4px; }

        .ai-features {
            max-width: 1100px; margin: 0 auto; padding: 0 24px 60px;
        }
        .ai-features h2 { font-size: 1.2rem; font-weight: 700; margin-bottom: 18px; text-align: center; }
        .feature-pills { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
        .feature-pill {
            padding: 8px 18px; border-radius: 20px; font-size: 0.78rem; font-weight: 600;
            background: rgba(99,102,241,0.1); border: 1px solid rgba(99,102,241,0.2); color: #a5b4fc;
        }

        .back-link { text-align: center; padding-bottom: 60px; }
        .back-link a { color: var(--primary); text-decoration: none; font-size: 0.85rem; font-weight: 600; }
        .back-link a:hover { text-decoration: underline; }

        .loading { text-align: center; padding: 40px; color: var(--muted); }
        .spinner { display: inline-block; width: 28px; height: 28px; border: 3px solid var(--border); border-top-color: var(--primary); border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div class="metrics-header">
    <h1><span>SimuPharma</span> Platform Metrics</h1>
    <p>Real-time usage statistics from our AI-powered pharmaceutical virtual laboratory</p>
</div>

<div id="loadingState" class="loading">
    <div class="spinner"></div>
    <p style="margin-top:10px">Loading platform metrics...</p>
</div>

<div id="metricsContent" style="display:none">
    <div class="metrics-grid" id="metricsGrid"></div>

    <div class="instrument-section">
        <h2><i class="fas fa-flask-vial"></i> Instrument Usage Breakdown</h2>
        <div class="inst-grid" id="instrumentGrid"></div>
    </div>

    <div class="ai-features">
        <h2><i class="fas fa-robot"></i> AI Capabilities</h2>
        <div class="feature-pills" id="featurePills"></div>
    </div>

    <div class="back-link">
        <a href="index.html"><i class="fas fa-arrow-left"></i> Back to SimuPharma</a>
    </div>
</div>

<script>
const INST_LABELS = {
    uvvis: 'UV-Vis Spectroscopy', ftir: 'FTIR Spectroscopy', hplc: 'HPLC',
    gc: 'Gas Chromatography', mass_spec: 'Mass Spectrometry',
    polarimeter: 'Polarimetry', psa: 'Particle Size Analysis'
};

async function loadMetrics() {
    try {
        const res = await fetch('/api/v1/metrics/public');
        const data = await res.json();

        document.getElementById('metricsGrid').innerHTML = `
            <div class="metric-card">
                <div class="metric-icon">👥</div>
                <div class="metric-value">${data.total_registered_users.toLocaleString()}</div>
                <div class="metric-label">Registered Users</div>
            </div>
            <div class="metric-card">
                <div class="metric-icon">🧪</div>
                <div class="metric-value">${data.total_simulations_run.toLocaleString()}</div>
                <div class="metric-label">Simulations Run</div>
            </div>
            <div class="metric-card">
                <div class="metric-icon">📝</div>
                <div class="metric-value">${data.total_quizzes_completed.toLocaleString()}</div>
                <div class="metric-label">Quizzes Completed</div>
            </div>
            <div class="metric-card">
                <div class="metric-icon">⭐</div>
                <div class="metric-value">${data.pro_subscribers.toLocaleString()}</div>
                <div class="metric-label">Pro Subscribers</div>
            </div>
            <div class="metric-card">
                <div class="metric-icon">🏫</div>
                <div class="metric-value">${data.institutions_represented}</div>
                <div class="metric-label">Institutions</div>
            </div>
            <div class="metric-card">
                <div class="metric-icon">📈</div>
                <div class="metric-value">${data.avg_mastery_pct.toFixed(0)}%</div>
                <div class="metric-label">Avg Student Mastery</div>
            </div>
        `;

        const instHtml = Object.keys(INST_LABELS).map(key => `
            <div class="inst-card">
                <div class="inst-count">${(data.instrument_usage[key] || 0).toLocaleString()}</div>
                <div class="inst-name">${INST_LABELS[key]}</div>
            </div>
        `).join('');
        document.getElementById('instrumentGrid').innerHTML = instHtml;

        document.getElementById('featurePills').innerHTML = (data.ai_features || []).map(f =>
            `<div class="feature-pill"><i class="fas fa-sparkles"></i> ${f}</div>`
        ).join('');

        document.getElementById('loadingState').style.display = 'none';
        document.getElementById('metricsContent').style.display = 'block';
    } catch (err) {
        document.getElementById('loadingState').innerHTML =
            `<p style="color:#ef4444;">Failed to load metrics. Please try again later.</p>`;
    }
}

loadMetrics();
</script>
</body>
</html>
