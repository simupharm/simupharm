<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="100%" height="100%">
  <defs>
    <marker id="arrowBlue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#007bff" />
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#28a745" />
    </marker>
    <marker id="arrowData" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6c757d" />
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#ffffff" />

  <text x="450" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#333">Gas Chromatography (GC) Flow Diagram</text>

  <rect x="330" y="140" width="80" height="120" fill="#fff3cd" stroke="#fd7e14" stroke-width="2" rx="5" />
  <text x="370" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#fd7e14" font-weight="bold">Heated</text>

  <rect x="460" y="100" width="180" height="200" fill="#fff3cd" stroke="#fd7e14" stroke-width="2" rx="5" />
  <text x="550" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#fd7e14" font-weight="bold">Column Oven</text>

  <rect x="690" y="140" width="80" height="120" fill="#fff3cd" stroke="#fd7e14" stroke-width="2" rx="5" />
  <text x="730" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#fd7e14" font-weight="bold">Heated</text>


  <g transform="translate(50, 180)">
    <path d="M10,0 Q30,-10 50,0 L50,80 Q30,90 10,80 L10,0" fill="#e9ecef" stroke="#333" stroke-width="2" />
    <ellipse cx="30" cy="0" rx="20" ry="5" fill="#dee2e6" stroke="#333" stroke-width="2" />
    <text x="30" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="12">Carrier Gas</text>
  </g>

  <g transform="translate(150, 205)">
    <circle cx="20" cy="0" r="15" fill="#fff" stroke="#333" stroke-width="2" />
    <line x1="20" y1="0" x2="30" y2="-8" stroke="#333" stroke-width="2" />
    <text x="20" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="10">Regulator</text>
  </g>

  <g transform="translate(230, 190)">
    <rect x="0" y="-15" width="50" height="30" fill="#fff" stroke="#333" stroke-width="2" />
    <text x="25" y="5" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" dy="0.3em">Flow Ctl</text>
  </g>

  <g transform="translate(345, 180)">
    <rect x="0" y="0" width="50" height="60" fill="#fff" stroke="#333" stroke-width="2" />
    <rect x="15" y="-20" width="20" height="20" fill="#ddd" stroke="#333" stroke-width="1" /> <line x1="25" y1="-35" x2="25" y2="-20" stroke="#28a745" stroke-width="2" /> <text x="25" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="12">Injector</text>
  </g>

  <g transform="translate(470, 110)">
    <path d="M40,95 
             C40,95 60,40 90,40 
             C120,40 140,95 140,95
             C140,95 120,150 90,150
             C60,150 40,95 40,95" 
          fill="none" stroke="#28a745" stroke-width="3" />
    <text x="90" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="12">Column</text>
  </g>

  <g transform="translate(705, 180)">
    <rect x="0" y="0" width="50" height="50" fill="#fff" stroke="#333" stroke-width="2" />
    <circle cx="25" cy="25" r="10" fill="#ddd" />
    <text x="25" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="12">Detector</text>
  </g>

  <g transform="translate(820, 175)">
    <rect x="0" y="0" width="60" height="45" fill="#fff" stroke="#333" stroke-width="2" rx="3" />
    <line x1="0" y1="35" x2="60" y2="35" stroke="#333" stroke-width="1" />
    <polygon points="20,45 40,45 50,55 10,55" fill="#333" /> <text x="30" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="8">Data</text>
    <text x="30" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="12">PC/Integrator</text>
  </g>

  <line x1="100" y1="205" x2="160" y2="205" stroke="#007bff" stroke-width="3" marker-end="url(#arrowBlue)" />

  <line x1="190" y1="205" x2="220" y2="205" stroke="#007bff" stroke-width="3" marker-end="url(#arrowBlue)" />

  <line x1="280" y1="205" x2="335" y2="205" stroke="#007bff" stroke-width="3" marker-end="url(#arrowBlue)" />

  <path d="M395,205 L450,205 L470,205" stroke="#28a745" stroke-width="3" fill="none" marker-end="url(#arrowGreen)" />
  <line x1="510" y1="205" x2="510" y2="205" stroke="#28a745" stroke-width="3" /> <path d="M610,205 L650,205 L680,205" stroke="#28a745" stroke-width="3" fill="none" marker-end="url(#arrowGreen)" />

  <line x1="755" y1="205" x2="810" y2="205" stroke="#6c757d" stroke-width="2" stroke-dasharray="4" marker-end="url(#arrowData)" />

  <g transform="translate(50, 350)">
    <rect x="0" y="0" width="300" height="40" fill="none" stroke="#ccc" rx="5" />
    
    <line x1="20" y1="20" x2="50" y2="20" stroke="#007bff" stroke-width="3" />
    <text x="60" y="25" font-family="Arial, sans-serif" font-size="12">Carrier Gas</text>
    
    <line x1="140" y1="20" x2="170" y2="20" stroke="#28a745" stroke-width="3" />
    <text x="180" y="25" font-family="Arial, sans-serif" font-size="12">Sample Path</text>
  </g>

</svg>